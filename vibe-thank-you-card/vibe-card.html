<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>VIBE — بطاقة شكر</title>
<style>
  @font-face { font-family: 'Amiri';      src: url('fonts/Amiri-Regular.ttf');      font-weight: 400; }
  @font-face { font-family: 'Amiri';      src: url('fonts/Amiri-Bold.ttf');         font-weight: 700; }
  @font-face { font-family: 'Aref Ruqaa'; src: url('fonts/ArefRuqaa-Regular.ttf');  font-weight: 400; }
  @font-face { font-family: 'Aref Ruqaa'; src: url('fonts/ArefRuqaa-Bold.ttf');     font-weight: 700; }
  @font-face { font-family: 'Reem Kufi';  src: url('fonts/ReemKufi-Bold.ttf');      font-weight: 700; }
  @font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Light.ttf');   font-weight: 300; }
  @font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Medium.ttf');  font-weight: 500; }

  :root {
    --ivory:      #FBF8F1;
    --ivory-2:    #F5EFE4;
    --ink:        #262019;
    --ink-soft:   #4C4133;
    --ember:      #D95B21;
    --ember-deep: #BC4A15;
    --engrave:    #C7B79E;
  }

  @page { size: 210mm 99mm; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 210mm; height: 99mm; overflow: hidden; }

  .card {
    position: fixed;
    top: 0; left: 0;
    width: 210mm; height: 99mm;
    overflow: hidden;
    background: radial-gradient(ellipse 150% 120% at 50% 42%, var(--ivory) 0%, var(--ivory-2) 100%);
    font-family: 'Amiri', serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ————— ceremonial double frame ————— */
  .frame-outer {
    position: absolute; inset: 5mm;
    border: 0.35mm solid rgba(199, 183, 158, 0.75);
  }
  .frame-inner {
    position: absolute; inset: 6.6mm;
    border: 0.15mm solid rgba(199, 183, 158, 0.5);
  }
  .corner {
    position: absolute; width: 2.1mm; height: 2.1mm;
    background: var(--ivory);
    border: 0.28mm solid var(--ember);
    transform: rotate(45deg);
  }
  .corner.tl { top: 3.95mm;  left: 3.95mm; }
  .corner.tr { top: 3.95mm;  right: 3.95mm; }
  .corner.bl { bottom: 3.95mm; left: 3.95mm; }
  .corner.br { bottom: 3.95mm; right: 3.95mm; }

  /* ————— ghost diamond behind the mark ————— */
  .ghost {
    position: absolute;
    width: 54mm; height: 54mm;
    top: 49.5mm; left: 167.5mm;
    transform: translate(-50%, -50%) rotate(45deg);
    border: 0.3mm solid rgba(217, 91, 33, 0.08);
  }
  .ghost::after {
    content: '';
    position: absolute; inset: 4.5mm;
    border: 0.2mm solid rgba(217, 91, 33, 0.06);
  }

  /* ————— composition ————— */
  .text-block {
    position: absolute;
    top: 49.5mm; left: 13mm;
    width: 112mm;
    transform: translateY(-50%);
    text-align: center;
    direction: rtl;
  }

  .opening {
    font-family: 'Amiri', serif;
    font-size: 12pt;
    line-height: 1.55;
    color: var(--ink-soft);
  }

  .ornament {
    display: flex; align-items: center; justify-content: center;
    gap: 2.6mm;
    margin: 3.4mm auto 3.6mm;
  }
  .ornament .line {
    width: 16mm; height: 0.16mm;
    background: linear-gradient(to right, transparent, var(--engrave));
  }
  .ornament .line.rev { background: linear-gradient(to left, transparent, var(--engrave)); }
  .ornament .gem {
    width: 1.7mm; height: 1.7mm;
    background: var(--ember);
    transform: rotate(45deg);
  }

  .credo {
    font-family: 'Aref Ruqaa', serif;
    font-weight: 700;
    font-size: 22pt;
    line-height: 1.6;
    color: var(--ink);
    white-space: nowrap;
  }

  .body-text {
    margin-top: 3.2mm;
    font-family: 'Amiri', serif;
    font-size: 11.5pt;
    line-height: 1.95;
    color: var(--ink-soft);
  }

  .signoff {
    margin-top: 3.4mm;
    font-family: 'Aref Ruqaa', serif;
    font-weight: 400;
    font-size: 14pt;
    line-height: 1.5;
    color: var(--ember-deep);
  }

  /* ————— thread of silence ————— */
  .divider {
    position: absolute;
    top: 49.5mm; left: 134mm;
    height: 56mm; width: 0.22mm;
    transform: translateY(-50%);
    background: linear-gradient(to bottom, transparent, var(--engrave) 22%, var(--engrave) 78%, transparent);
  }
  .divider .gem {
    position: absolute;
    left: 50%; top: 50%;
    width: 1.5mm; height: 1.5mm;
    background: var(--ivory);
    border: 0.24mm solid var(--engrave);
    transform: translate(-50%, -50%) rotate(45deg);
  }

  /* ————— the mark ————— */
  .mark {
    position: absolute;
    top: 49.5mm; left: 167.5mm;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .mark .ar {
    font-family: 'Reem Kufi', sans-serif;
    font-weight: 700;
    font-size: 33pt;
    line-height: 1.3;
    color: var(--ember);
    direction: rtl;
  }
  .mark .en {
    margin-top: 1.6mm;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 12.5pt;
    line-height: 1.2;
    letter-spacing: 0.52em;
    text-indent: 0.52em; /* optically recenter letterspaced caps */
    color: var(--ember);
  }
</style>
</head>
<body>
<div class="card">

  <div class="frame-outer"></div>
  <div class="frame-inner"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="ghost"></div>

  <div class="text-block">
    <p class="opening">منذ اليوم الأول، ونحن نعمل بقاعدةٍ واحدة:</p>

    <div class="ornament">
      <span class="line"></span><span class="gem"></span><span class="line rev"></span>
    </div>

    <p class="credo">جودةٌ لا تُساوَم، وعِطرٌ لا يُقاوَم.</p>

    <p class="body-text">نأمل أن تكون راضياً عن تجربتك، وندعوك لمواصلة هذه التجربة معنا،<br>واكتشاف ما نصنعه لأصحاب الذوق الرفيع.</p>

    <p class="signoff">شكراً لاختيارك فايب.</p>
  </div>

  <div class="divider"><span class="gem"></span></div>

  <div class="mark">
    <div class="ar">فايـــب</div>
    <div class="en">VIBE</div>
  </div>

</div>
</body>
</html>
