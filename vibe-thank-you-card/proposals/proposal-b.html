<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اقتراح B · سكون</title>
<link rel="stylesheet" href="shared.css">
<style>
  .stack .mark-ar { font-size: 21pt; line-height: 1.3; }
  .stack .mark-en { font-size: 8.5pt; line-height: 1.2; margin-top: 0.8mm; }
  .rule { width: 13mm; height: 0.18mm; margin: 4.6mm auto; background: var(--engrave); }
  .stack .opening   { font-size: 11.5pt; }
  .stack .credo     { font-size: 21pt; margin-top: 2.6mm; }
  .stack .body-text { font-size: 11pt; margin-top: 2.6mm; }
  .stack .signoff   { font-size: 13pt; margin-top: 3.4mm; }
</style>
</head>
<body>
<div class="card">
  <div class="stack">
    <div class="mark-ar">فايـــب</div>
    <div class="mark-en">VIBE</div>
    <div class="rule"></div>
    <p class="opening">منذ اليوم الأول، ونحن نعمل بقاعدةٍ واحدة:</p>
    <p class="credo">جودةٌ لا تُساوَم، وعِطرٌ لا يُقاوَم.</p>
    <p class="body-text">نأمل أن تكون راضياً عن تجربتك، وندعوك لمواصلة هذه التجربة معنا، واكتشاف ما نصنعه لأصحاب الذوق الرفيع.</p>
    <p class="signoff">شكراً لاختيارك فايب.</p>
  </div>
</div>
</body>
</html>
