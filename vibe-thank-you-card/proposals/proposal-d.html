<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اقتراح D · همس</title>
<link rel="stylesheet" href="shared.css">
<style>
  .stack .opening   { font-size: 11.5pt; }
  .stack .credo     { font-size: 24pt; margin-top: 3.4mm; }
  .stack .body-text { font-size: 11pt; margin-top: 3.2mm; }
  .stack .signoff   { font-size: 13pt; margin-top: 3.8mm; }
  .whisper { margin-top: 6.2mm; }
  .whisper .mark-ar { font-size: 15pt; line-height: 1.3; }
  .whisper .mark-en { font-size: 7pt; line-height: 1.2; margin-top: 0.4mm; letter-spacing: 0.6em; text-indent: 0.6em; }
</style>
</head>
<body>
<div class="card">
  <div class="stack">
    <p class="opening">منذ اليوم الأول، ونحن نعمل بقاعدةٍ واحدة:</p>
    <p class="credo">جودةٌ لا تُساوَم، وعِطرٌ لا يُقاوَم.</p>
    <p class="body-text">نأمل أن تكون راضياً عن تجربتك، وندعوك لمواصلة هذه التجربة معنا، واكتشاف ما نصنعه لأصحاب الذوق الرفيع.</p>
    <p class="signoff">شكراً لاختيارك فايب.</p>
    <div class="whisper">
      <div class="mark-ar">فايـــب</div>
      <div class="mark-en">VIBE</div>
    </div>
  </div>
</div>
</body>
</html>
