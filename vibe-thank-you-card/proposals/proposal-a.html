<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اقتراح A · نقاء</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="card">
  <div class="text-block">
    <p class="opening">منذ اليوم الأول، ونحن نعمل بقاعدةٍ واحدة:</p>
    <p class="credo">جودةٌ لا تُساوَم، وعِطرٌ لا يُقاوَم.</p>
    <p class="body-text">نأمل أن تكون راضياً عن تجربتك، وندعوك لمواصلة هذه التجربة معنا،<br>واكتشاف ما نصنعه لأصحاب الذوق الرفيع.</p>
    <p class="signoff">شكراً لاختيارك فايب.</p>
  </div>
  <div class="divider"></div>
  <div class="mark">
    <div class="mark-ar">فايـــب</div>
    <div class="mark-en">VIBE</div>
  </div>
</div>
</body>
</html>
